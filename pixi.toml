[workspace]
name = "gst-codec-bench"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
cmake = ">=3.16"
pkg-config = "*"
cxx-compiler = "*"
gstreamer = "*"
gst-plugins-base = "*"
gst-plugins-good = "*"
gst-plugins-bad = "*"
gst-plugins-ugly = "*"
gst-libav = "*"

[tasks]
configure = "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/share/pkgconfig cmake -S . -B build"
build = { cmd = "cmake --build build -j", depends-on = ["configure"] }
test = { cmd = "./build/gst_codec_bench --software --frames 100", depends-on = ["build"] }
